[package]
name = "tearpdf"
version = "1.0.0"
description = "TearPDF desktop PDF & image toolkit"
authors = ["TearPDF Developer"]
edition = "2021"

[lib]
name = "tearpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
rayon = "1.8"
image = "0.24"
kamadak-exif = "0.5"
tempfile = "3"
which = "6.0"
base64 = "0.22"
pdfium-render = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
